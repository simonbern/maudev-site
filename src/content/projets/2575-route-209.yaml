# (reference/NewInfo/Franklin) donnent au projet sa première couverture et sa
# page — jusque-là sa carte n'avait qu'un gabarit « Photos à venir » et deux
# faits.
nom: "2575 route 209"
statut: realise
ordre: 0
url: { fr: 2575-route-209, en: 2575-route-209 }

adresse: "2575 route 209"
ville: "Franklin"

resume:
  fr: "Immeuble de 6 logements à Franklin."
  en: "Six-apartment building in Franklin."

# Premier paragraphe : le client. Les suivants décrivent les photos livrées —
# le seul projet du portefeuille en plein champ, et ça se voit.
description:
  fr:
    - "Un immeuble résidentiel de 6 logements à Franklin."
    - "Trois niveaux posés sur un socle de brique, en pleine campagne : le terrain est en herbe jusqu'au pied du bâtiment, sans voisin immédiat. Les logements de l'arrière ont chacun un balcon couvert, superposés sur toute la hauteur."
    - "À l'intérieur, une aire ouverte unique avec cuisine à îlot et comptoir foncé, une thermopompe murale, et une salle de bain avec bain autoportant et douche vitrée. Depuis les balcons, la vue porte sur un verger."
  en:
    - "A six-apartment residential building in Franklin."
    - "Three levels set on a brick base, in open country: grass runs right up to the building, with no immediate neighbour. The rear apartments each have a covered balcony, stacked the full height of the façade."
    - "Inside, a single open-plan area with an island kitchen and a dark counter, a wall-mounted heat pump, and a bathroom with a freestanding tub and a glass shower. From the balconies, the view runs over an orchard."

