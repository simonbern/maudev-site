couverture:
  src: ../../assets/projets/110-ste-cecile/couverture.jpg
  alt:
    fr: "110 Ste-Cécile — Salaberry-de-Valleyfield"
    en: "110 Ste-Cécile — Salaberry-de-Valleyfield"

# Trois couvertures ont été écartées avant celle-ci. Celle du mirror était un
# rendu 3D (passants, vélos) alors que l'immeuble est livré depuis longtemps :
# ne jamais présenter une image de synthèse comme une photo du réel. Deux
# intérieurs ont pris sa place tour à tour, et une photo d'intérieur ne sert
# jamais de couverture à une réalisation.
#
# Résolu le 2026-09-02 : la livraison « NewInfo » apporte une vue de drone —
# les quatre étages, la rivière Saint-Charles et l'hôtel de ville dans le
# cadre. Elle situe le projet, ce qu'aucun intérieur ne faisait.
#
# Les deux photos d'espaces communs (palier du 4e, stationnement souterrain)
# sont les premières du site. `categorie: commun` a été rajoutée au schéma
# pour elles — elle y était prévue « le jour où ces photos arrivent ».
