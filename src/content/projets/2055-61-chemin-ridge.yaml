adresse: "2055-61 Chemin Ridge"
ville: "Huntingdon"

# Un seul projet, quatre phases. Le client parle de « Ridge 1, 2, 3, 4 » et
# fournit un cahier par phase, mais les quatre immeubles se suivent sur le
# même terrain, portent le même programme et se sont livrés en un an. Les
# séparer en quatre fiches donnerait quatre cartes presque identiques dans la
# grille de /projets. Les dates sont dans `phase`, le détail dans le texte.
phase:
  fr: "Livré en quatre phases, de juillet 2024 à juillet 2025"
  en: "Delivered in four phases, July 2024 to July 2025"

resume:
  fr: "Projet mixte livré à Huntingdon."
  en: "Completed mixed-use project in Huntingdon."

description:
  fr:
    - "Un ensemble mixte qui répartit logements et espaces commerciaux sur quatre bâtiments distincts, aux 2055, 2057, 2059 et 2061, chemin Ridge."
    - "Le 2055 compte douze logements. Les trois autres immeubles en comptent dix chacun, au-dessus de deux espaces commerciaux au rez-de-chaussée dont la façade donne sur le chemin Ridge. Chaque bâtiment fait trois étages."
    - "Le projet a été développé en quatre phases : le 2055 en juillet 2024, le 2057 en septembre 2024, le 2059 en mai 2025 et le 2061 en juillet 2025."
    - "Les logements sont majoritairement des 4 ½. Les 3 ½ se trouvent au rez-de-chaussée des deux premières phases, les 5 ½ à celui des deux dernières. Tous ont des comptoirs de quartz, une thermopompe, un bain et une douche séparés, un stationnement et le Wi-Fi inclus."
  en:
    - "A mixed-use cluster that distributes homes and commercial space across four distinct buildings, at 2055, 2057, 2059 and 2061 chemin Ridge."
    - "2055 holds twelve apartments. The other three hold ten each, above two ground-floor commercial spaces fronting onto chemin Ridge. Every building is three storeys."
    - "The project was built in four phases: 2055 in July 2024, 2057 in September 2024, 2059 in May 2025 and 2061 in July 2025."
    - "Most apartments are 4 ½. The 3 ½ units sit on the ground floor of the first two phases, the 5 ½ units on that of the last two. All have quartz countertops, a heat pump, a separate tub and shower, one parking space and Wi-Fi included."

