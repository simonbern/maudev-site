# Généré depuis reference/mirror/www.mau-dev.ca/{fr,en}/projects/110-ste-cecile
# Enrichi le 2026-09-02 avec le cahier de location du client
# (reference/NewInfo, relevé dans reference/newinfo-mapping.md).
nom: "110 Ste-Cécile"
statut: realise
ordre: 0
url: { fr: 110-ste-cecile, en: 110-ste-cecile }

adresse: "110 Ste-Cécile"
ville: "Salaberry-de-Valleyfield"

# Le cahier de location du client s'intitule « 106 rue Sainte-Cécile » et
# étiquette le bâtiment #106 sur le plan d'implantation. Le site, le mirror de
# l'ancien site et le premier courriel disent 110. Même ville, même décompte,
# même immeuble : c'est un écart d'adresse, pas un second projet.
#
# Deuxième fois que ça arrive — Hermine était 102 ou 110 (plans-mapping.md
# § 5), et c'est le cahier qui avait raison. On garde 110, qui reste la valeur
# de trois sources sur quatre, et on marque le champ. À confirmer avec Alex.
aConfirmer: [adresse]

resume:
  fr: "Projet mixte livré à Salaberry-de-Valleyfield."
  en: "Completed mixed-use project in Salaberry-de-Valleyfield."

description:
  fr:
    - "Un immeuble mixte qui associe 24 logements à une composante commerciale en rez-de-chaussée."
    - "Les logements occupent les trois étages supérieurs, huit par palier, et se répartissent exactement moitié-moitié entre 3 ½ et 4 ½. Le rez-de-chaussée accueille deux suites commerciales de 1 762 et 1 506 pieds carrés."
    - "L'immeuble compte un ascenseur, un stationnement intérieur au sous-sol et des rangements au rez-de-chaussée. Il fait face à la rivière Saint-Charles et à l'hôtel de ville de Salaberry-de-Valleyfield."
  en:
    - "A mixed-use building pairing 24 residential units with a ground-floor commercial component."
    - "The apartments occupy the three upper floors, eight per level, split exactly half and half between 3 ½ and 4 ½. The ground floor holds two commercial suites of 1,762 and 1,506 square feet."
    - "The building has an elevator, underground parking and ground-floor storage lockers. It faces the Saint-Charles river and the Salaberry-de-Valleyfield city hall."

