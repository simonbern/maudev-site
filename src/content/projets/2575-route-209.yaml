  - label: { fr: "Statut", en: "Status" }
    valeur: { fr: "Livré", en: "Delivered" }
  - label: { fr: "Programme", en: "Program" }
    valeur: { fr: "Résidentiel", en: "Residential" }
  - label: { fr: "Bâtiments", en: "Buildings" }
    valeur: { fr: "1", en: "1" }
  - label: { fr: "Logements", en: "Apartments" }
