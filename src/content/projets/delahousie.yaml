    icone: countertop
  - label: { fr: Thermopompe, en: Heat pump }
    icone: wind
  - label: { fr: Wi-Fi, en: Wi-Fi }
    icone: wifi
  - label: { fr: 1 stationnement, en: 1 parking space }
