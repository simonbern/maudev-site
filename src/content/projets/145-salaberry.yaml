# Premier paragraphe : le mirror. Les suivants décrivent les photos livrées.
description:
  fr:
    - "Un actif mixte qui combine une base résidentielle dense à une composante commerciale de 10 000 pi²."
    - "Quatre étages sur rue. Le rez-de-chaussée est entièrement commercial — une file de vitrines sous un auvent continu — et les trois niveaux de logements le surmontent, en brique claire et panneaux blancs, avec des balcons en saillie. Un niveau de stationnement intérieur occupe le sous-sol."
    - "Les logements donnent sur de grandes fenêtres d'angle et s'ouvrent en aire unique de la cuisine au séjour. Les salles de bain reçoivent un bain autoportant et une douche vitrée séparée."
  en:
    - "A mixed-use asset that combines a dense residential base with 10,000 sq. ft. of commercial area."
    - "Four storeys on the street. The ground floor is entirely commercial — a run of storefronts under a continuous canopy — with three residential levels above in light brick and white panels, balconies projecting from the face. A level of indoor parking occupies the basement."
    - "The apartments open onto large corner windows and run as a single space from kitchen to living room. Bathrooms have a freestanding tub and a separate glass shower."

