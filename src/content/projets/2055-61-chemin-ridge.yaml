# Par type, pas par unité : 42 logements pour 8 plans-types répétés d'un
# bâtiment à l'autre. Les superficies sont les totales des fiches, balcon
# compris — c'est la convention du schéma et celle des cahiers.
#
# Aucun prix. Le projet est loué ; « Sur demande » laisserait croire qu'un
# appel donnerait un chiffre. Le seul loyer que le client mentionne encore
# (4 ½ à 1 250 $/mois) concerne les logements qui se libèrent, pas le projet
# livré — il n'a pas sa place sur une page de réalisation.
logements:
  - type: "3 ½"
    nombre: 3
    superficieMin: 842
    superficieMax: 914
    note:
      fr: "Au rez-de-chaussée des phases 1 et 2 (2055 et 2057)."
      en: "Ground floor of phases 1 and 2 (2055 and 2057)."
  - type: "4 ½"
    nombre: 35
    superficieMin: 970
    superficieMax: 1145
    note:
      fr: "Le type dominant du projet, présent sur les trois étages des quatre bâtiments."
      en: "The project's dominant layout, on all three floors of all four buildings."
  - type: "5 ½"
    nombre: 4
    superficieMin: 1282
    superficieMax: 1282
    note:
      fr: "Au rez-de-chaussée des phases 3 et 4 (2059 et 2061), deux par immeuble."
      en: "Ground floor of phases 3 and 4 (2059 and 2061), two per building."

