<link rel="stylesheet" href="_astro/PageLayout.DMnV6Y9U.css"></head><body class="body"> <main class="main">  <header class="nav nav--light nav--overlay"> <div class="width nav__inner"> <a class="nav__brand" href="en">MauDev</a> <nav> <ul class="nav__list"> <li><a href="en/projects">Projects</a></li><li><a href="en/about">Our model</a></li> <li><a class="nav__lang" href="fr">FR</a></li> </ul> </nav> </div> </header> <section class="home"> <section class="hero" data-node-id="71:16"> <video class="hero__bg" autoplay muted loop playsinline preload="metadata" aria-hidden="true" disablepictureinpicture disableremoteplayback> <source src="videos/Rook_bird.mov"> </video> <div class="hero__shade"></div> <div class="width hero__menu" data-node-id="71:29"> <div class="hero__links"> <a href="en/about" class="link-underline reveal-in-up" style="--reveal-delay: 110ms;"> Our model </a> <a href="en/projects" class="link-underline reveal-in-up" style="--reveal-delay: 220ms;"> Projects </a> </div> <p>MauDev is a family real estate developer and general contractor that sources sites, unlocks density, builds, leases, and manages assets through one integrated platform.</p> </div> <div class="hero__ticker" aria-label="Messages defilants"> <div class="hero__ticker-track"> <span class="hero__ticker-item">483 homes built</span><span class="hero__ticker-item">136,000 sq. ft. of commercial and industrial space delivered</span><span class="hero__ticker-item">151 homes under construction</span><span class="hero__ticker-item">$30M of 2025 construction volume</span><span class="hero__ticker-item">776 homes in development</span><span class="hero__ticker-item">483 homes built</span><span class="hero__ticker-item">136,000 sq. ft. of commercial and industrial space delivered</span><span class="hero__ticker-item">151 homes under construction</span><span class="hero__ticker-item">$30M of 2025 construction volume</span><span class="hero__ticker-item">776 homes in development</span> </div> </div> </section> <section class="home-green" data-node-id="71:67"> <div class="home-green__inner"> <h2>From acquisition to day-to-day management</h2> <div class="home-steps"> <article class="step-card reveal-on-scroll" style="--reveal-delay:220ms;"> <h3> <span class="step-icon" style="--mask:url('images/blueprint.png')"></span> <span class="step-card__title">1. The site</span> </h3> <p>We buy well, identify density upside, and move planning and zoning work forward before construction begins.</p> </article><article class="step-card reveal-on-scroll" style="--reveal-delay:340ms;"> <h3> <span class="step-icon" style="--mask:url('images/investment.png')"></span> <span class="step-card__title">2. The capital</span> </h3> <p>MauDev structures financing, manages CMHC files, and keeps cost control tight from day one.</p> </article><article class="step-card reveal-on-scroll" style="--reveal-delay:460ms;"> <h3> <span class="step-icon" style="--mask:url('images/construction.png')"></span> <span class="step-card__title">3. The construction</span> </h3> <p>Integrated partners strengthen control over excavation risk, materials, schedule, and field execution.</p> </article><article class="step-card reveal-on-scroll" style="--reveal-delay:580ms;"> <h3> <span class="step-icon" style="--mask:url('images/cashout.png')"></span> <span class="step-card__title">4. The operations</span> </h3> <p>The team handles leasing, day-to-day management, bookkeeping, and year-end reporting in house.</p> </article> </div> <a href="en/about" class="link-underline">Discuss an opportunity</a> </div> </section> <section class="home-projects" data-node-id="83:326"> <div class="home-projects__inner"> <p class="home-projects__lead">A growing track record of delivered and upcoming projects across Quebec local markets.</p> <div class="project-stack"> <article class="project-spotlight" data-node-id="83:362" style="--stack-z:1; --stack-shift:0rem;"> <img src="images/projects/110-alphonse-desjardins.jpg" alt="110 Alphonse-Desjardins"> <div class="project-spotlight__content"> <h3>110 Alphonse-Desjardins</h3> <h4>Salaberry-de-Valleyfield</h4> <p>A compact 23-unit residential building that strengthens MauDev&#39;s growing presence in Valleyfield.</p> <a href="en/projects/110-alphonse-desjardins" class="link-underline">See project</a> </div> </article><article class="project-spotlight" data-node-id="83:362" style="--stack-z:2; --stack-shift:1.35rem;"> <img src="images/projects/145-salaberry.jpg" alt="145 Salaberry"> <div class="project-spotlight__content"> <h3>145 Salaberry</h3> <h4>Salaberry-de-Valleyfield</h4> <p>A mixed-use asset that combines a dense residential base with 10,000 sq. ft. of commercial area.</p> <a href="en/projects/145-salaberry" class="link-underline">See project</a> </div> </article><article class="project-spotlight" data-node-id="83:362" style="--stack-z:3; --stack-shift:2.7rem;"> <img src="images/projects/47-nicholson.jpg" alt="47 Nicholson"> <div class="project-spotlight__content"> <h3>47 Nicholson</h3> <h4>Salaberry-de-Valleyfield</h4> <p>An existing building repositioned through a renovation completed in 2022.</p> <a href="en/projects/47-nicholson" class="link-underline">See project</a> </div> </article> </div> </div> </section> </section> <script>
  (() => {
    const cards = Array.from(document.querySelectorAll('.home-green .reveal-on-scroll'));
    if (!cards.length) return;

    const reveal = (el) => el.classList.add('is-visible');

    if (!('IntersectionObserver' in window)) {
      cards.forEach(reveal);
      return;
    }

    const observer = new IntersectionObserver(
      (entries, obs) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          reveal(entry.target);
          obs.unobserve(entry.target);
        });
      },
      {
        threshold: 0.18,
        rootMargin: '0px 0px -12% 0px'
      }
    );

    cards.forEach((card) => observer.observe(card));
  })();
</script> <section class="cookie-banner" data-cookie-banner hidden> <p class="cookie-banner__title">Privacy preferences</p> <p>We use cookies to measure site traffic. You can accept or reject analytics cookies.</p> <div> <div> <form id="consent-form" data-consent-form> <div data-cookie-settings hidden> <div class="cookie-setting"> <div> <p class="cookie-setting__desc"> Essentials for site functionality. </p> </div> <label class="switch" for="ipConsent"> <input type="checkbox" data-consent="ip" checked id="ipConsent" name="ipConsent" value="true"> <span class="slider"></span> </label> </div> <div class="cookie-setting"> <div> <p class="cookie-setting__desc"> Analytics cookies help us understand how visitors interact with our site to improve user experience. </p> </div> <label class="switch" for="gaConsent"> <input type="checkbox" data-consent="analytics" checked id="gaConsent" name="gaConsent" value="true"> <span class="slider"></span> </label> </div> <div class="button-left"> <button class="button" data-consent-action="save" hidden type="button"> Save preferences </button> </div> </div> <div class="cookie-banner__actions"> <button type="button" class="button" data-consent-action="accept">Accept</button> <button type="button" class="button button--secondary" data-consent-action="reject">Reject</button> <button type="button" class="button button--secondary" data-consent-action="personalize">Personalize</button> </div> </form> </div> </div> </section> <script type="module" src="_astro/cookie-consent.CXe3eKSr.js"></script> <script type="module" src="scripts/init-consent.js"></script>  </main> <footer class="global-footer"> <div class="global-footer__inner"> <section class="global-footer__col"> <h3>Pages</h3> <ul> <li><a href="en">Overview</a></li><li><a href="en/about">About us</a></li><li><a href="en/projects">Projects</a></li> </ul> </section> <section class="global-footer__col"> <h3>Social</h3> <ul> <li><a href="https://www.linkedin.com" target="_blank" rel="noreferr