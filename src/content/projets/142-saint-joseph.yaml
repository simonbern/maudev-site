# Premier paragraphe : le mirror. Les suivants décrivent les photos livrées.
description:
  fr:
    - "Un projet structuré autour de 12 unités résidentielles et d'un locataire ancré."
    - "Un long volume de trois étages en brique rouge, rythmé par des travées de revêtement gris et par une série de pignons qui se répètent sur toute la façade. Chaque logement du rez-de-chaussée a sa porte sur rue, repérée par une lettre."
    - "À l'intérieur, des aires ouvertes avec cuisine à îlot et armoires de bois, des portes-fenêtres donnant sur l'arrière, et des salles de bain en céramique marbrée — certaines avec bain et douche, d'autres avec une douche vitrée pleine hauteur."
  en:
    - "A structured project built around 12 residential units and an anchor tenant."
    - "A long three-storey volume in red brick, punctuated by bays of grey cladding and by a run of gables repeated across the front. Each ground-floor apartment has its own street door, marked with a letter."
    - "Inside, open-plan areas with island kitchens and wood cabinetry, patio doors onto the rear, and bathrooms in marbled tile — some with a tub and shower, others with a full-height glass shower."

