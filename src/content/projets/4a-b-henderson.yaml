# Couverture et galerie refaites le 2026-09-08.
#
# Historique en trois temps. La couverture du mirror montrait le second
# bâtiment encore sous membrane Tyvek, cônes de chantier au premier plan — un
# chantier sur une page de réalisations. Le 2026-09-02 elle a été remplacée
# par une façade terminée tirée du Facebook de Chester, portrait, recadrée en
# 3:2. Le client a depuis livré dix photos professionnelles du projet
# (reference/NewInfo/4A-4B Henderson) : elles remplacent les trois photos
# Facebook, couverture comprise.
#
# **Ce n'est pas qu'une question de qualité.** Les photos Facebook avaient été
# reprises « sans leur permission », de l'aveu du client lui-même ; celles-ci
# viennent de lui. Henderson ne dépend donc plus d'images de tiers — Ridge et
# Ste-Cécile, eux, en dépendent toujours (voir reference/newinfo-mapping.md).
#
# La galerie ouvre sur les deux extérieurs : la façade de face, qui sert aussi
# de couverture, puis la vue d'angle où le second bâtiment apparaît derrière
# le premier. C'est la seule image qui montre que le projet en compte deux.
