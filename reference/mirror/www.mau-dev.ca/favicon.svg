%;background:#fff;border-radius:50%;border:1px solid #f8a097;transform:translateY(-50%);transition:transform .2s ease}input:checked+.slider{background:#d18882}input:checked+.slider:before{transform:translate(20px,-50%)}.cookie-setting{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.75rem 0;border-top:0}.cookie-setting__title{font-weight:600}.cookie-setting__desc{font-size:.85rem;opacity:.7}.button-left{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem}
