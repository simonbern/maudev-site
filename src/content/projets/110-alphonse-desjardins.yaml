# La seule photo d'extérieur du lot sert de couverture ET ouvre la galerie :
# sur une réalisation, on veut d'abord voir le bâtiment.
#
# Recadrée en 1200 × 800 à partir du 2000 × 1334 d'origine, en trois passes.
# La photo est prise depuis le trottoir d'en face : l'immeuble n'occupe que le
# tiers supérieur du cadre, le reste est chaussée puis trottoir.
#
# **Le cadre est calé sur le bâtiment.** Il court de y=190 à y=740 dans
# l'original, donc son centre est à 465 ; la fenêtre de 800 px part de 65 pour
# l'y centrer exactement, et laisse 125 px de ciel au-dessus, 125 px de
# chaussée en dessous. Le trottoir est hors cadre.
#
# **Le bord droit est à 1497, juste avant les bacs à ordures** (mesurés à
# x=1498 → 1660). Les sortir par le recadrage plutôt que par une retouche
# garde la photo intacte : c'est le bâtiment tel qu'il a été photographié.
#
# Le client a proposé une version où les bacs avaient été effacés par IA
# générative. Écartée : la comparaison pixel à pixel montre que la retouche a
# aussi **régénéré toute l'extrémité droite du bâtiment** — balcon, ouverture
# du rez-de-chaussée, poteau — et l'a rendue en 1264 × 843 au lieu de
# 2000 × 1334. DESIGN.md et CLAUDE.md interdisent de présenter comme photo ce
# qui n'en est plus une ; c'est la règle qui avait déjà fait écarter le rendu
# 3D du 110 Ste-Cécile. Le fichier reste dans reference/NewInfo/ si le client
# tranche autrement.
#
# Pas d'agrandissement à 1500 px comme les autres couvertures : 1200 px est la
# largeur réelle du recadrage, et interpoler pour atteindre une convention
# n'ajoute aucun détail.
