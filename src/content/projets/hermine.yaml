nom: Projet Hermine
statut: location
ordre: 100
url: { fr: hermine, en: hermine }

adresse: 102 rue Alphonse-Desjardins
ville: Salaberry-de-Valleyfield
# L'introduction du courriel client écrit « 110 Alphonse-Desjardins », alors que
# son descriptif ET la couverture des plans Chester disent 102. Voir
# reference/plans-mapping.md § Points à trancher.
aConfirmer: [adresse]

unites: 54
# `unitesLouees` retiré sur demande du client (2026-08-28). Le champ existe
# toujours au schéma ; le hero affichait « 20/54 déjà loués ».
etages: 4
livraison: "2026-07"

resume:
  fr: "54 logements neufs de 3 ½, 4 ½ et 5 ½ à Salaberry-de-Valleyfield, livraison en juillet 2026."
  en: "54 new 3½, 4½ and 5½ apartments in Salaberry-de-Valleyfield, ready July 2026."

description:
  fr:
    - "L'immeuble compte 54 unités réparties sur 4 étages, avec une livraison en juillet 2026. Les logements sont offerts en 3 ½, 4 ½ et 5 ½, afin de répondre à différents besoins résidentiels."
    - "Avec ses finitions modernes, ses commodités incluses et son emplacement pratique, le projet Hermine offre des logements conçus pour allier confort, qualité et simplicité au quotidien."
    - "Le 4e étage offre un attrait tout particulier : les résidents peuvent profiter d'une vue dégagée sur la ville et admirer le magnifique lac Saint-François. Un panorama qui ajoute une touche unique au quotidien et permet de profiter pleinement de l'environnement qui entoure le projet."
  en:
    - "The building has 54 units across 4 floors, with delivery in July 2026. Apartments come in 3½, 4½ and 5½ layouts, to suit a range of household needs."
    - "With its modern finishes, included amenities and practical location, Projet Hermine offers apartments designed to combine comfort, quality and everyday simplicity."
    - "The 4th floor holds a particular appeal: residents enjoy an open view over the city and out to beautiful Lac Saint-François. A panorama that adds something singular to daily life and makes the most of the setting around the project."

# Fourchettes relevées sur les 19 fiches de plan (reference/plans-mapping.md).
# Aucun prix : le client renvoie à une « liste de prix » qui n'a pas été fournie.
logements:
  - type: 3 ½
    nombre: 11
    superficieMin: 618
    superficieMax: 690
  - type: 4 ½
    nombre: 33
    superficieMin: 798
    superficieMax: 1082
  - type: 5 ½
    nombre: 10
    superficieMin: 1084
    superficieMax: 1515

inclusions:
  - label: { fr: Thermopompe, en: Heat pump }
    icone: wind
  - label: { fr: Échangeur d'air, en: Air exchanger }
    icone: air-vent
  - label: { fr: Rangement intérieur, en: Indoor storage }
    icone: package
    payant: true
  - label: { fr: 5 électroménagers, en: 5 appliances }
    icone: refrigerator
  - label: { fr: Ascenseur, en: Elevator }
    icone: move-vertical
  - label: { fr: Intercom, en: Intercom }
    icone: bell-ring
  - label: { fr: Wi-Fi, en: Wi-Fi }
    icone: wifi
  - label: { fr: Stationnement intérieur, en: Indoor parking }
    icone: square-parking
    payant: true

# Drone livré le 2026-08-25 : 1,16 Mo, 1280×720, 9,24 s, H.264 High,
# 1,0 Mb/s, sans piste audio, moov en tête (lecture progressive OK).
#
# La livraison faisait 12,0 s et contenait deux plans coupés à 9,24 s. Le
# second était une vue aérienne où la moitié du bâtiment est encore en
# panneaux isolants rubannés, avec nacelle, pelle mécanique et filet de
# sécurité — un chantier en cours, sous un hero qui annonce « Disponible,
# 20 sur 54 déjà loués ». Sur décision du client, la vidéo est coupée aux
# 277 premières images, en copie de flux (aucun réencodage, aucune perte) :
#   ffmpeg -i <original> -map 0:v:0 -frames:v 277 -c copy -movflags +faststart
# L'original 12 s est conservé dans reference/NEW/HERMINE/.
video:
  mp4: /videos/hermine/hermine.mp4
  carte: /videos/hermine/hermine-carte.mp4
  poster: ../../assets/projets/hermine/video-poster.jpg

# Source d'images : src/assets/projets/NEW/HERMINE (livraison 2026-08-15),
# recadrée dans photos/. Ce jeu remplace l'ancien : 3000x2000 au lieu de
# 2400x1600, il couvre 4 unités au lieu d'une, et il contient enfin une vraie
# vue extérieure de rue. Les anciennes prises meublées restent dans photos/.
# Couverture : vue de rue, choix du client. À noter que la photo montre le
# chantier en cours — pare-intempéries DRYline à nu, balcons non finis, cônes
# orange — alors que la carte porte un badge « Disponible ». À remplacer dès
# qu'une vue extérieure du bâti terminé sera disponible ; les images drone du
# 2026-08-25 n'en contiennent aucune.
couverture:
  src: ../../assets/projets/hermine/photos/exterieur-rue-01.jpg
  alt:
    fr: "Façade d'angle du projet Hermine vue de la rue Alphonse-Desjardins"
    en: "Corner façade of Projet Hermine seen from rue Alphonse-Desjardins"

