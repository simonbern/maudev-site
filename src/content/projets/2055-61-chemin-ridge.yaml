# Trois couvertures ont été écartées avant celle-ci. Celle du mirror montrait
# un ensemble de maisons en rangée, sans rapport avec les quatre immeubles du
# chemin Ridge ; deux intérieurs meublés ont pris sa place tour à tour, et une
# photo d'intérieur ne sert jamais de couverture à une réalisation.
#
# Résolu le 2026-09-02 : la livraison « NewInfo » apporte enfin une façade —
# le 2057, numéro civique lisible, rez-de-chaussée commercial en brique et
# deux étages de logements. C'est la phase 2 des quatre, mais c'est le
# bâtiment type de l'ensemble (2057, 2059 et 2061 sont bâtis sur le même
# programme).
#
# La façade ouvre la galerie : sur une réalisation, on veut d'abord voir le
# bâtiment. Aucun numéro d'unité n'est déclaré — les photos viennent du
# Facebook de Chester et ne portent aucune identification d'unité, et on
# n'invente pas un numéro pour remplir un champ.
