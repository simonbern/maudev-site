# Huit plans-types répétés à l'identique sur les 2e, 3e et 4e étages : douze
# 3 ½ et douze 4 ½. Superficies totales, balcon compris.
logements:
  - type: "3 ½"
    nombre: 12
    superficieMin: 643
    superficieMax: 758
  - type: "4 ½"
    nombre: 12
    superficieMin: 906
    superficieMax: 982

inclusions:
  - label: { fr: "Ascenseur", en: "Elevator" }
    icone: move-vertical
  - label: { fr: "Stationnement intérieur", en: "Indoor parking" }
    icone: square-parking
  - label: { fr: "Rangement intérieur", en: "Indoor storage" }
